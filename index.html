<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>wh · Colección</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0c1422;color:#edf3fa}*{box-sizing:border-box}body{margin:0}header{padding:22px max(18px,calc((100% - 1100px)/2));background:#142136;border-bottom:1px solid #344359}h1{margin:0;font-size:30px}small,.muted{color:#a8b7c8}main{max-width:1100px;margin:auto;padding:22px 16px}button,input{font:inherit}button{background:#243a56;color:#f1f6ff;border:1px solid #415773;border-radius:9px;padding:9px 13px;cursor:pointer}button:hover,.active{background:#346b9b}input{background:#101e30;color:white;border:1px solid #52627a;border-radius:8px;padding:9px;max-width:100%}section,.unit{background:#17253a;border:1px solid #34465e;border-radius:14px;padding:17px;margin:14px 0}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stats article{background:#192b43;border:1px solid #334963;padding:15px;border-radius:12px}.stats strong{font-size:24px;display:block}.unit h3{margin:0 0 6px}.mini{display:inline-flex;align-items:center;gap:6px;margin:4px 8px 4px 0;white-space:nowrap}.mini input{width:18px;height:18px;accent-color:#68b2e9}.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:15px}.stage{background:#101e30;border-radius:10px;padding:12px;min-width:0}.stage b{display:block;margin-bottom:8px}.hours input{width:82px}.notice{padding:11px 13px;border-radius:10px;background:#243a56;margin:12px 0}a{color:#8ed3ff}@media(max-width:640px){.stages{grid-template-columns:1fr}h1{font-size:25px}}
</style></head><body>
<header><div class="row between"><div><h1>wh</h1><small>Mi colección de miniaturas</small></div><div id="auth"></div></div></header>
<main><div id="message"></div><div class="stats" id="stats"></div><div class="tabs" id="tabs"></div><div class="row between"><h2 id="heading">Colección</h2><div class="row"><button id="export">Exportar JSON</button><label class="row">Importar JSON <input type="file" id="import" accept="application/json" style="max-width:160px"></label></div></div><div id="units"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const client=window.supabase.createClient('https://rgahdldjlrsldpmcqcrq.supabase.co','sb_publishable_k9nfw8ZZUrnzG7nfB6CVSA_l3g-Vvgi');
let catalog=[],progress={},user=null,army='Todos',saving=new Set();
const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString('es-ES');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localKey='wh-collection-v1';
function loadLocal(){try{return JSON.parse(localStorage.getItem(localKey))||{}}catch{return {}}}
function saveLocal(){localStorage.setItem(localKey,JSON.stringify(progress))}
function state(u){return progress[u.id]||{purchased:u.initial_owned||0,assembled:0,painted:0,paint_hours:u.paint_hours_per_mini,assembly_hours:u.assembly_hours_per_mini}}
function notice(s){$('message').innerHTML=s?'<div class="notice">'+esc(s)+'</div>':''}
async function init(){const {data:{session}}=await client.auth.getSession();user=session?.user||null;renderAuth();await refresh()}
async function refresh(){notice('Cargando colección…');let q=await client.from('collection_units').select('*').order('sort_order');if(q.error){notice('Inicia sesión para cargar el catálogo. '+q.error.message);return}catalog=q.data||[];if(user){const r=await client.from('collection_progress').select('*');if(r.error)notice('Error de sincronización: '+r.error.message);else{progress={};for(const x of r.data||[])progress[x.unit_id]=x}}else progress=loadLocal();notice(user?'Sincronización con Supabase activada.':'Modo local: inicia sesión para sincronizar entre dispositivos.');render()}
function renderAuth(){if(user){$('auth').innerHTML='<div class="row"><small>'+esc(user.email)+'</small><button id="logout">Salir</button></div>';$('logout').onclick=async()=>{await client.auth.signOut();user=null;progress=loadLocal();renderAuth();render()}}else{$('auth').innerHTML='<form id="login" class="row"><input type="email" id="email" placeholder="Tu correo electrónico" required><button>Entrar por correo</button></form>';$('login').onsubmit=async e=>{e.preventDefault();const email=$('email').value;const r=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});notice(r.error?r.error.message:'Revisa tu correo para acceder mediante el enlace recibido.')}}}
function render(){const armies=['Todos',...new Set(catalog.map(x=>x.army))];if(!armies.includes(army))army='Todos';$('tabs').innerHTML=armies.map(a=>'<button data-army="'+esc(a)+'" class="'+(a===army?'active':'')+'">'+esc(a)+'</button>').join('');document.querySelectorAll('[data-army]').forEach(b=>b.onclick=()=>{army=b.dataset.army;render()});const selected=catalog.filter(x=>army==='Todos'||x.army===army);$('heading').textContent=army==='Todos'?'Toda la colección':army;const totals=selected.reduce((a,u)=>{let s=state(u);a.all+=u.quantity;a.p+=s.purchased;a.a+=s.assembled;a.t+=s.painted;a.points+=Number(u.points||0);a.pending+=Math.max(0,u.quantity-s.purchased)*Number(u.price_eur||0)/u.quantity;a.paint+=s.painted*Number(s.paint_hours??u.paint_hours_per_mini);a.build+=s.assembled*Number(s.assembly_hours??u.assembly_hours_per_mini);return a},{all:0,p:0,a:0,t:0,points:0,pending:0,paint:0,build:0});$('stats').innerHTML=[['Miniaturas',fmt(totals.all)],['Compradas',fmt(totals.p)+' / '+fmt(totals.all)],['Montadas',fmt(totals.a)],['Pintadas',fmt(totals.t)],['Pendiente estimado',fmt(Math.round(totals.pending))+' €'],['Horas registradas',fmt(Math.round((totals.paint+totals.build)*10)/10)+' h']].map(x=>'<article><small>'+x[0]+'</small><strong>'+x[1]+'</strong></article>').join('');$('units').innerHTML=selected.map(u=>{const s=state(u);const mk=(key,label)=>'<div class="stage"><b>'+label+' · '+s[key]+'/'+u.quantity+'</b>'+Array.from({length:u.quantity},(_,i)=>'<label class="mini"><input type="checkbox" data-id="'+esc(u.id)+'" data-stage="'+key+'" data-n="'+(i+1)+'" '+(i<s[key]?'checked':'')+'><small>'+(i+1)+'</small></label>').join('')+'</div>';return '<div class="unit"><div class="row between"><div><h3>'+esc(u.name)+'</h3><small>'+esc(u.army)+' · '+esc(u.category)+' · '+u.quantity+' miniaturas · '+fmt(u.points)+' pt</small></div><small>'+fmt(u.price_eur)+' € / unidad</small></div><div class="stages">'+mk('purchased','Compradas')+mk('assembled','Montadas')+mk('painted','Pintadas')+'</div><div class="row hours" style="margin-top:14px"><label>Horas montaje / mini <input type="number" min="0" step="0.25" data-hours="assembly_hours" data-id="'+esc(u.id)+'" value="'+Number(s.assembly_hours??u.assembly_hours_per_mini)+'"></label><label>Horas pintura / mini <input type="number" min="0" step="0.25" data-hours="paint_hours" data-id="'+esc(u.id)+'" value="'+Number(s.paint_hours??u.paint_hours_per_mini)+'"></label></div></div>'}).join('')||'<section>No hay unidades.</section>';document.querySelectorAll('input[data-stage]').forEach(el=>el.onchange=async()=>{const u=catalog.find(x=>x.id===el.dataset.id);const s={...state(u)},k=el.dataset.stage,n=+el.dataset.n;s[k]=el.checked?Math.max(s[k],n):Math.min(s[k],n-1);if(k==='painted'&&el.checked){s.assembled=Math.max(s.assembled,s.painted);s.purchased=Math.max(s.purchased,s.assembled)}if(k==='assembled'&&el.checked)s.purchased=Math.max(s.purchased,s.assembled);s.assembled=Math.min(s.assembled,s.purchased);s.painted=Math.min(s.painted,s.assembled);await persist(u,s)});document.querySelectorAll('input[data-hours]').forEach(el=>el.onchange=async()=>{const u=catalog.find(x=>x.id===el.dataset.id);const s={...state(u)};s[el.dataset.hours]=Math.max(0,+el.value||0);await persist(u,s)})}
async function persist(u,s){progress[u.id]=s;saveLocal();render();if(!user)return;const payload={user_id:user.id,unit_id:u.id,purchased:s.purchased,assembled:s.assembled,painted:s.painted,paint_hours:s.paint_hours??u.paint_hours_per_mini,assembly_hours:s.assembly_hours??u.assembly_hours_per_mini,updated_at:new Date().toISOString()};const r=await client.from('collection_progress').upsert(payload,{onConflict:'user_id,unit_id'});if(r.error)notice('No se ha podido guardar en la nube: '+r.error.message)}
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,progress},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wh-coleccion.json';a.click();URL.revokeObjectURL(a.href)};
$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());const items=data.progress||data;for(const u of catalog){if(!items[u.id])continue;const x=items[u.id],s={...state(u),...x};s.purchased=Math.max(0,Math.min(u.quantity,+s.purchased||0));s.assembled=Math.min(s.purchased,+s.assembled||0);s.painted=Math.min(s.assembled,+s.painted||0);await persist(u,s)}notice('Datos importados.')}catch(err){notice('Error al importar: '+err.message)}e.target.value=''};
client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT'){user=session?.user||null;renderAuth();setTimeout(refresh,0)}});init();
</script></body></html>
